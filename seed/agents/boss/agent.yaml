# Orchestrator. Decides: answer, ask a clarifying question, or delegate to a sub-agent.
# Paths below are filled in with your data folder when the agent is seeded.
id: boss
name: Boss
role: orchestrator
workspace: shared
models:
  default: cli-claude/sonnet
  # local-only threads use the local model; it must be pulled (`ollama pull qwen3:8b`)
  allowed: [cli-claude/sonnet, local/qwen3:8b]
tools: []
fs:
  write: ["{{ACHORDS_HOME}}/agents/boss/work"]
budget:
  per_run_usd: 0.5
