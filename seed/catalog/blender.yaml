# ahujasid/blender-mcp (MIT), talks to the Blender add-on on this Mac (uvx mcp-for-blender
# install-addon, then enable it in Blender). No credentials. Telemetry off.
# Write tools run code inside Blender (full access to this Mac): not allowed yet.
id: blender
name: Blender
description: Inspect the open Blender scene and viewport (read-only for now).
command: uvx
args: ["--from", "mcp-for-blender==2.2.7", "mcp-for-blender"]
env:
  DISABLE_TELEMETRY: "true"
install: Install uv (https://docs.astral.sh/uv/) so `uvx` is on the PATH, then in Blender enable the add-on from `uvx mcp-for-blender install-addon`.
hosts: [127.0.0.1]
tools:
  read: [get_addon_status, get_scene_info, look, search_assets]
  write: [execute_blender_code, generate_3d, import_asset]
# Connection test (web Integrations page).
test:
  tool: get_scene_info
# ADR-0054: achords opens Blender in the background for a run when it is not running and quits it
# again once no active task needs it. Ready when the add-on listens (it starts its socket itself).
app:
  name: Blender
  open: ["-g", "-a", "Blender"]
  ready: { port: 9876, timeout_s: 60 }
