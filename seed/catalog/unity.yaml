# CoplayDev/unity-mcp (MIT), talks to the MCP for Unity package in the open Unity Editor
# (Package Manager: com.coplaydev.unity-mcp). No credentials. Telemetry off.
# Most tools both read and change the project: not allowed yet.
id: unity
name: Unity
description: Inspect the open Unity project (read-only for now).
command: uvx
args: ["--from", "mcpforunityserver==10.3.0", "mcp-for-unity", "--transport", "stdio"]
env:
  DISABLE_TELEMETRY: "true"
install: Install uv (https://docs.astral.sh/uv/) so `uvx` is on the PATH, then add the package com.coplaydev.unity-mcp in Unity's Package Manager.
hosts: [127.0.0.1]
tools:
  read:
    [
      find_in_file,
      validate_script,
      manage_script_capabilities,
      get_sha,
      get_test_job,
      unity_docs,
      unity_reflect,
    ]
  write:
    [
      manage_scene,
      manage_gameobject,
      manage_script,
      manage_asset,
      execute_code,
      run_tests,
      read_console,
    ]
  # ADR-0067: changes stay in the local project (git); execute_code runs any code.
  class:
    manage_scene: reversible
    manage_gameobject: reversible
    manage_script: reversible
    manage_asset: reversible
    execute_code: live
    run_tests: reversible
    read_console: reversible
# ADR-0054: achords opens the Unity Editor on the run's working folder (the agent's first own
# folder) when that folder is a Unity project, and quits it once no active task needs it. Ready
# when the MCP for Unity bridge listens (6400 unless that port was taken). Several Editor versions
# installed: copy this entry to ~/.achords/catalog/unity.yaml with the full path of the right one.
app:
  name: Unity
  open: ["-g", "-a", "Unity", "--args", "-projectPath", "{workdir}"]
  requires: ProjectSettings/ProjectVersion.txt
  ready: { port: 6400, timeout_s: 180 }
